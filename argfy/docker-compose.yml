services:
  postgres:
    image: postgres:16-alpine
    container_name: argfy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-argfy}
      POSTGRES_USER:     ${POSTGRES_USER:-argfy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argfy_dev}
    ports:
      - "${POSTGRES_PORT:-5544}:5432"
    volumes:
      - argfy_pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argfy} -d ${POSTGRES_DB:-argfy}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  argfy_pgdata:
