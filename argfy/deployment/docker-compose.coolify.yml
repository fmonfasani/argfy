services:
  postgres:
    container_name: argfy-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - argfy_pgdata:/var/lib/postgresql/data
      - ../backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      default:
        aliases:
          - argfy-postgres

  backend:
    container_name: argfy-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@argfy-postgres:5432/${POSTGRES_DB}
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: '["https://argfy.com","https://www.argfy.com"]'
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
      WEB_CONCURRENCY: "1"
      ENABLE_SCHEDULER: "true"
      TZ: UTC
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8200:8000"
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.argfy-api.rule=Host(`api.argfy.com`)
      - traefik.http.routers.argfy-api.entrypoints=https
      - traefik.http.routers.argfy-api.tls=true
      - traefik.http.routers.argfy-api.tls.certresolver=letsencrypt
      - traefik.http.services.argfy-api.loadbalancer.server.port=8000

  frontend:
    container_name: argfy-web
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: https://api.argfy.com/api/v1
      NEXT_PUBLIC_BACKEND_URL: https://api.argfy.com
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - backend
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3200:3000"
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.argfy-web.rule=Host(`argfy.com`) || Host(`www.argfy.com`)
      - traefik.http.routers.argfy-web.entrypoints=https
      - traefik.http.routers.argfy-web.tls=true
      - traefik.http.routers.argfy-web.tls.certresolver=letsencrypt
      - traefik.http.services.argfy-web.loadbalancer.server.port=3000

volumes:
  argfy_pgdata:
    name: argfy_pgdata

networks:
  default:
  coolify:
    external: true
