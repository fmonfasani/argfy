name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:  # permite ser invocado desde deploy.yml

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argfy/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: argfy/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio httpx
      - run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argfy/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: argfy/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
