name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:  # permite ser invocado desde deploy.yml

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argfy/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: argfy/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio pytest-cov httpx ruff

      - name: Ruff lint
        run: ruff check app tests || true   # warning-only por ahora; quitar `|| true` cuando el codebase esté limpio

      - name: Pytest + coverage
        run: |
          python -m pytest tests/ -q \
            --cov=app --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: argfy/backend/coverage.xml
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argfy/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: argfy/frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint --if-present || true
      - name: Build (incluye type-check via tsc)
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: argfy/backend
          push: false
          tags: argfy-backend:ci
      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: argfy/frontend
          push: false
          tags: argfy-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_BASE=https://api.argfy.com/api/v1
